name: Build portable desktop apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - run: npm run check
      - run: npm run build:mac
      - run: npm run size:mac
      - uses: actions/upload-artifact@v4
        with:
          name: simple-calendar-macos-app
          path: src-tauri/target/release/bundle/macos/Simple Calendar.app

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - run: npm run check
      - run: npm run build:portable
      - run: npm run size:windows
      - uses: actions/upload-artifact@v4
        with:
          name: simple-calendar-windows-portable
          path: src-tauri/target/release/simple-calendar.exe
