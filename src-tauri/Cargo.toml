[package]
name = "simple-calendar"
version = "0.1.0"
description = "Small Korean, English, Japanese, and Chinese desktop calendar app."
authors = ["krnomad"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
